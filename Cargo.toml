[workspace]
resolver = "2"
members = ["crates/sweep-core", "crates/sweep-macos", "crates/disk-sweep"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/disk-sweep"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
glob = "0.3"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
sweep-core = { path = "crates/sweep-core" }
sweep-macos = { path = "crates/sweep-macos" }
